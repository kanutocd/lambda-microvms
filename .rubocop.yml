plugins:
  - rubocop-rake
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  Exclude:
    - vendor/**/*
    - tmp/**/*

Style/Documentation:
  Enabled: true

Metrics/BlockLength:
  Exclude:
    - test/**/*
    - "*.gemspec"

Minitest/MultipleAssertions:
  Max: 5

Metrics/MethodLength:
  Max: 16

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/AbcSize:
  Max: 20

Metrics/ClassLength:
  Max: 110
